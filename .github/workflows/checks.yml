name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Xcode uses its bundled Swift. Xcode 16.4 has Swift 6.1, the minimum
          # because the OpenFeature Swift SDK 0.7 needs it. Xcode 26.3 has Swift 6.2,
          # and Xcode 26.6 has the latest, Swift 6.3.
          - runner: macos-15
            xcode: "16.4"
          - runner: macos-26
            xcode: "26.3"
          - runner: macos-26
            xcode: "26.6"
            sanitize: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build core SDK
        run: swift build --target Featurevisor

      - name: Build OpenFeature provider
        run: swift build --target FeaturevisorOpenFeature

      - name: Test
        run: swift test

      - name: Test with Thread Sanitizer
        if: matrix.sanitize
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: swift test --sanitize=thread

  platforms-and-integration:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build core SDK for iOS
        run: swift build --target Featurevisor --triple arm64-apple-ios15.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --scratch-path /tmp/featurevisor-ios-core

      - name: Build OpenFeature provider for iOS
        run: swift build --target FeaturevisorOpenFeature --triple arm64-apple-ios15.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --scratch-path /tmp/featurevisor-ios-openfeature

      - name: Verify clean package consumers
        run: ./scripts/verify-consumers.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Set up Featurevisor example-1 project
        run: |
          mkdir example-1
          cd example-1
          npx --yes @featurevisor/cli@latest init --example=1
          npm install
          npx featurevisor build
          npx featurevisor test --onlyFailures

      - name: Run Featurevisor project tests against Swift SDK
        run: swift run featurevisor test --projectDirectoryPath=./example-1 --onlyFailures
