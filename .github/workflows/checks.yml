name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        swift-version: ["6.0.3", "6.2.1"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: ${{ matrix.swift-version }}

      - name: Build core SDK
        run: swift build --target Featurevisor

      - name: Build OpenFeature provider
        run: swift build --target FeaturevisorOpenFeature

      - name: Test
        run: swift test

      - name: Test with Thread Sanitizer
        if: matrix.swift-version == '6.2.1'
        run: swift test --sanitize=thread

  platforms-and-integration:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "6.2.1"

      - name: Build core SDK for iOS
        run: swift build --target Featurevisor --triple arm64-apple-ios14.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --scratch-path /tmp/featurevisor-ios-core

      - name: Build OpenFeature provider for iOS
        run: swift build --target FeaturevisorOpenFeature --triple arm64-apple-ios14.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" --scratch-path /tmp/featurevisor-ios-openfeature

      - name: Verify clean package consumers
        run: ./scripts/verify-consumers.sh

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Set up Featurevisor example-1 project
        run: |
          mkdir example-1
          cd example-1
          npx --yes @featurevisor/cli@3.1.0 init --example=1
          npm install
          npx featurevisor build
          npx featurevisor test --onlyFailures

      - name: Run Featurevisor project tests against Swift SDK
        run: swift run featurevisor test --projectDirectoryPath=./example-1 --onlyFailures
