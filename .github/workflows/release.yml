name: Release validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Validate semantic version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v3.1.0"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "from: \"$version\"" README.md; then
            echo "README installation version does not match $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "6.2.1"

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Test
        run: swift test

      - name: Build public library targets
        run: |
          swift build --target Featurevisor
          swift build --target FeaturevisorOpenFeature

      - name: Verify clean package consumers
        run: ./scripts/verify-consumers.sh
