name: Release validation

# Prefer the manual run: it validates the selected commit first and only then
# creates the tag that Swift Package Manager resolves. Tags pushed by hand are
# still validated afterwards.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create after validation, such as v4.0.0"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Validate semantic version tag
        shell: bash
        run: bash scripts/verify-release.sh "$RELEASE_TAG"

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2.4.0
        with:
          swift-version: "6.2.1"

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Test
        run: swift test

      - name: Build public library targets
        run: |
          swift build --target Featurevisor
          swift build --target FeaturevisorOpenFeature

      - name: Verify clean package consumers
        run: ./scripts/verify-consumers.sh

  tag:
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create the validated tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "$RELEASE_TAG already exists" >&2
            exit 1
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
